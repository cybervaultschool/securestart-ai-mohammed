[build]
  command = "node scripts/verify-site.mjs"
  publish = "site"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Security headers for every page. The tool cannot be embedded in other sites (frame-ancestors 'none').
# challenges.cloudflare.com is allowed for the Cloudflare Turnstile bot check on the email form only.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
